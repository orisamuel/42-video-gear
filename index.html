<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0B">
<title>צילה · ניהול ציוד צילום</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0A0A0B; overflow: hidden; }
  iframe#app {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  /* מסך טעינה עד שהאפליקציה עולה */
  #loader {
    position: fixed; inset: 0; z-index: 10;
    background: #0A0A0B; color: #FAFAFA;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-family: 'Heebo', 'Segoe UI', sans-serif; text-align: center; padding: 24px;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  #loader img { width: 88px; height: 88px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #loader h1 { font-weight: 900; font-size: 2rem; letter-spacing: -0.02em; }
  #loader p { color: #A1A1AA; font-size: 0.9rem; max-width: 340px; line-height: 1.6; }
  #loader a { color: #FAFAFA; }
</style>
</head>
<body>

<div id="loader">
  <img src="favicon-64.png" alt="צילה">
  <h1>צילה</h1>
  <p id="loaderMsg">טוענת את הציוד...</p>
</div>

<iframe id="app" allow="clipboard-write"
        src="https://script.google.com/a/macros/42creative.co.il/s/AKfycbwYpBTjZV-ONyKbpL9OsyirMDLVjOpMphNEvIC-CB4wg1QgcaHrVvg_Rnb1rGytKYjSBA/exec"
        onload="setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600)"></iframe>

<script>
  // אם אחרי 8 שניות עדיין לא נטען — כנראה צריך להתחבר לחשבון 42 (דפי התחברות של גוגל לא נטענים בתוך iframe)
  setTimeout(function () {
    var loader = document.getElementById('loader');
    if (!loader.classList.contains('hidden')) {
      document.getElementById('loaderMsg').innerHTML =
        'הטעינה מתעכבת? כנראה צריך להתחבר לחשבון 42creative שלך.<br>' +
        '<a href="https://script.google.com/a/macros/42creative.co.il/s/AKfycbwYpBTjZV-ONyKbpL9OsyirMDLVjOpMphNEvIC-CB4wg1QgcaHrVvg_Rnb1rGytKYjSBA/exec">להתחברות ולכניסה ←</a>';
    }
  }, 8000);
</script>

</body>
</html>
