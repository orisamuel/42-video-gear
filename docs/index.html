<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0B">
<title>צילה · ניהול ציוד צילום</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0A0A0B; overflow: hidden; }
  iframe#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: #0A0A0B; color: #FAFAFA;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-family: 'Heebo', 'Segoe UI', sans-serif; text-align: center; padding: 24px;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay img { width: 88px; height: 88px; }
  #loader img { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .overlay h1 { font-weight: 900; font-size: 2rem; letter-spacing: -0.02em; }
  .overlay p { color: #A1A1AA; font-size: 0.95rem; max-width: 380px; line-height: 1.7; }
  .overlay .gate-badge {
    background: rgba(239, 68, 68, 0.14); color: #F87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 6px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 700;
  }
  .overlay button {
    font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    background: #fff; color: #0A0A0B; border: 0;
    padding: 12px 26px; border-radius: 10px; margin-top: 6px;
  }
  .overlay .alt { font-size: 0.8rem; color: #56565E; }
  .overlay .alt a { color: #A1A1AA; }
</style>
</head>
<body>

<!-- מסך טעינה -->
<div class="overlay" id="loader">
  <img src="favicon-64.png" alt="צילה">
  <h1>צילה</h1>
  <p>טוענת את הציוד...</p>
</div>

<!-- שער: חשבונות 42creative בלבד -->
<div class="overlay hidden" id="gate">
  <img src="favicon-64.png" alt="צילה">
  <h1>צילה</h1>
  <span class="gate-badge">🔒 לחשבונות ארגוניים בלבד</span>
  <p>
    המערכת פתוחה לחשבונות הארגוניים של <strong>42creative.co.il</strong> בלבד.<br>
    נראה שאינך מחובר/ת בדפדפן הזה עם חשבון כזה — מתחברים ונכנסים:
  </p>
  <button onclick="openAuth()">כניסה עם חשבון 42 ←</button>
  <p class="alt">החלון שנפתח לא חוזר? <a href="https://script.google.com/a/macros/42creative.co.il/s/AKfycbwYpBTjZV-ONyKbpL9OsyirMDLVjOpMphNEvIC-CB4wg1QgcaHrVvg_Rnb1rGytKYjSBA/exec">כניסה ישירה</a></p>
</div>

<iframe id="app" allow="clipboard-write"
        src="https://script.google.com/a/macros/42creative.co.il/s/AKfycbwYpBTjZV-ONyKbpL9OsyirMDLVjOpMphNEvIC-CB4wg1QgcaHrVvg_Rnb1rGytKYjSBA/exec"></iframe>

<script>
  var EXEC = 'https://script.google.com/a/macros/42creative.co.il/s/AKfycbwYpBTjZV-ONyKbpL9OsyirMDLVjOpMphNEvIC-CB4wg1QgcaHrVvg_Rnb1rGytKYjSBA/exec';
  var appReady = false;

  // האפליקציה משדרת 'ready' כשהיא חיה, ו-'reload' אחרי החלפת חשבון
  window.addEventListener('message', function (ev) {
    if (!ev || !ev.data) return;
    if (ev.data.tzila === 'ready') {
      appReady = true;
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('gate').classList.add('hidden');
    }
    if (ev.data.tzila === 'reload') location.reload();
  });

  // לא הגיע 'ready' בזמן סביר? גוגל חסמה בפנים — מציגים את השער
  setTimeout(function () {
    if (!appReady) {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('gate').classList.remove('hidden');
    }
  }, 9000);

  // כניסה/החלפת חשבון בפופאפ — כשנסגר, מרעננים את הדף
  function openAuth() {
    var w = window.open(
      'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(EXEC + '?authdone=1'),
      'tzila_auth', 'width=520,height=660'
    );
    if (!w) { alert('הדפדפן חסם את החלון — אפשרו חלונות קופצים ונסו שוב'); return; }
    var t = setInterval(function () {
      if (w.closed) { clearInterval(t); location.reload(); }
    }, 600);
  }
</script>

</body>
</html>
